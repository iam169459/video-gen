version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: deployment/docker/Dockerfile.backend
    volumes:
      - ../backend:/app
      - videogen_data:/app/data
    environment:
      - DEBUG=true
      - LOG_LEVEL=DEBUG
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app
    ports:
      - "8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  frontend:
    build:
      context: ..
      dockerfile: deployment/docker/Dockerfile.frontend
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
    command: npm run dev
    ports:
      - "3000:3000"

  celery-worker:
    build:
      context: ..
      dockerfile: deployment/docker/Dockerfile.backend
    volumes:
      - ../backend:/app
      - videogen_data:/app/data
    command: celery -A app.core.celery_app worker --loglevel=debug --concurrency=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  videogen_data: