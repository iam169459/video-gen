name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to production'
        required: false
        default: 'false'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Poetry
        run: pip install poetry

      - name: Install backend dependencies
        working-directory: ./backend
        run: poetry install --no-interaction --no-ansi

      - name: Run backend linting
        working-directory: ./backend
        run: |
          poetry run ruff check .
          poetry run black --check .
          poetry run mypy .

      - name: Run backend tests
        working-directory: ./backend
        run: poetry run pytest --cov=app --cov-report=xml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run frontend linting
        working-directory: ./frontend
        run: npm run lint

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

  build-backend:
    name: Build Backend Image
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'release' || github.event.inputs.deploy == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/docker/Dockerfile.backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: Build Frontend Image
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'release' || github.event.inputs.deploy == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/docker/Dockerfile.frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-release:
    name: Create Release Assets
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create backend release archive
        run: |
          cd backend
          tar -czf ../videogen-backend-${{ github.event.release.tag_name }}.tar.gz \
            --exclude=venv \
            --exclude=__pycache__ \
            --exclude=.pytest_cache \
            --exclude=.mypy_cache \
            --exclude=data \
            --exclude=*.pyc \
            .

      - name: Create frontend release archive
        run: |
          cd frontend
          tar -czf ../videogen-frontend-${{ github.event.release.tag_name }}.tar.gz \
            --exclude=node_modules \
            --exclude=.next \
            --exclude=out \
            --exclude=.turbo \
            --exclude=*.log \
            .

      - name: Upload release assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            videogen-backend-${{ github.event.release.tag_name }}.tar.gz
            videogen-frontend-${{ github.event.release.tag_name }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-staging:
    name: Deploy to Staging
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - name: Deploy to staging
        run: |
          echo "Deploy to staging server..."
          # Add your staging deployment commands here
          # Example: ssh user@staging-server "docker-compose pull && docker-compose up -d"

  deploy-production:
    name: Deploy to Production
    needs: [build-backend, build-frontend, create-release]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.event.inputs.deploy == 'true'
    environment: production
    steps:
      - name: Deploy to production
        run: |
          echo "Deploy to production server..."
          # Add your production deployment commands here
          # Example: ssh user@prod-server "docker-compose pull && docker-compose up -d"

  notify:
    name: Notify
    needs: [lint-and-test, build-backend, build-frontend, create-release, deploy-staging, deploy-production]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Send notification
        if: failure()
        run: |
          echo "Build failed!"
          # Add notification webhook here (Slack, Discord, Email, etc.)